spring.application.name=ai-developer-agent
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-predict=600
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.retry.max-attempts=1
spring.ai.tools.limits.max-calls-per-tool-default=1
spring.ai.tools.limits.max-total-tool-calls=3
spring.ai.tools.limits.on-limit-exceeded=THROW
spring.ai.tools.throw-exception-on-error=true
agent.model.timeout-ms=${MODEL_TIMEOUT_MS:45000}
server.error.include-stacktrace=never
